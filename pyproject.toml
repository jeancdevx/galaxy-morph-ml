[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-morph"
version = "0.1.0"
description = "Automatic galaxy morphology classification using CNNs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "GalaxyMorph Team", email = "team@galaxymorph.dev"}
]

keywords = ["astronomy", "machine-learning", "cnn", "classification", "pytorch"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "Pillow==10.2.0",
    "matplotlib==3.8.3",
    "PyYAML==6.0.1",
    "python-dotenv==1.0.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.0.0",
    "ipython==8.22.2",
    "notebook==7.1.2",
    "black==24.3.0",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/galaxy-morph"
Documentation = "https://galaxy-morph.readthedocs.io"
Repository = "https://github.com/yourusername/galaxy-morph.git"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]
