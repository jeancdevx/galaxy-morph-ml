services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: galaxy-morph:latest
    container_name: galaxy-morph-ml
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./notebooks:/app/notebooks
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    stdin_open: true
    tty: true
    command: bash
